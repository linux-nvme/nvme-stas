name: Coverage probe

# Manual, one-off probe: can a GitHub-hosted runner host the "make coverage"
# integration run? Every check reports its result instead of stopping the
# job, so one run answers every question. See the job summary.

on:
  push:
    branches: [ nightly-coverage-probe ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: "CHECKOUT: nvme-stas"
        uses: actions/checkout@v7

      - name: "INFO: kernel and systemd"
        run: |
          uname -a
          cat /etc/os-release
          systemctl is-system-running || true
          systemctl --failed --no-pager || true
          ip -brief address

      - name: "INSTALL: packages"
        run: |
          sudo apt-get update
          sudo apt-get install --yes --quiet nvme-cli avahi-daemon avahi-utils python3-coverage

      - name: "PROBE: kernel modules (stock kernel)"
        id: modules
        continue-on-error: true
        run: |
          rc=0
          for m in nvme_tcp nvmet nvmet_tcp null_blk; do
            if sudo modprobe "$m"; then
              echo "$m: loaded"
            else
              echo "$m: FAILED"
              rc=1
            fi
          done
          exit $rc

      - name: "PROBE: kernel modules (with linux-modules-extra)"
        id: modules_extra
        if: steps.modules.outcome == 'failure'
        continue-on-error: true
        run: |
          sudo apt-get install --yes --quiet "linux-modules-extra-$(uname -r)"
          rc=0
          for m in nvme_tcp nvmet nvmet_tcp null_blk; do
            if sudo modprobe "$m"; then
              echo "$m: loaded"
            else
              echo "$m: FAILED"
              rc=1
            fi
          done
          exit $rc

      - name: "PROBE: configfs"
        id: configfs
        continue-on-error: true
        run: |
          mountpoint /sys/kernel/config || sudo mount -t configfs none /sys/kernel/config
          ls -l /sys/kernel/config/nvmet

      - name: "PROBE: nvmet.py create (the coverage run's own target)"
        id: nvmet
        continue-on-error: true
        run: |
          sudo utils/nvmet/nvmet.py clean || true
          sudo utils/nvmet/nvmet.py create -f utils/nvmet/nvmet.conf
          sudo find /sys/kernel/config/nvmet -maxdepth 3 | sort

      - name: "PROBE: nvme discover over TCP (IPv4 and IPv6 loopback)"
        id: discover
        continue-on-error: true
        run: |
          sudo nvme discover -t tcp -a 127.0.0.1 -s 8009
          sudo nvme discover -t tcp -a ::1 -s 8009

      - name: "PROBE: nvme connect / disconnect an I/O controller"
        id: connect
        continue-on-error: true
        run: |
          sudo nvme connect -t tcp -a 127.0.0.1 -s 8009 -n nqn.1988-11.com.dell:klingons
          sleep 2
          sudo nvme list-subsys
          lsblk
          sudo nvme disconnect -n nqn.1988-11.com.dell:klingons

      - name: "PROBE: avahi publish / browse / resolve"
        id: avahi
        continue-on-error: true
        run: |
          sudo systemctl start avahi-daemon.service
          systemctl is-active avahi-daemon.service
          avahi-publish -s probe _nvme-disc._tcp 8009 "p=tcp" &
          pub=$!
          sleep 5
          avahi-browse --resolve --parsable --terminate _nvme-disc._tcp | tee browse.txt
          kill $pub || true
          # A resolved entry starts with "=". Keep one for the next step.
          grep '^=' browse.txt | grep ';IPv4;' | head -1 > resolved.txt
          test -s resolved.txt

      - name: "PROBE: nvme discover to the mDNS-resolved address"
        id: mdns_discover
        if: steps.avahi.outcome == 'success' && steps.nvmet.outcome == 'success'
        continue-on-error: true
        run: |
          addr=$(cut -d';' -f8 resolved.txt)
          port=$(cut -d';' -f9 resolved.txt)
          echo "resolved: $addr:$port"
          sudo nvme discover -t tcp -a "$addr" -s "$port"

      - name: "PROBE: systemd-run transient unit with BindPaths"
        id: bindpaths
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/fake-etc-nvme"
          echo probe > "$RUNNER_TEMP/fake-etc-nvme/probe-marker"
          sudo systemd-run --wait --pipe --property=Type=oneshot \
            --property=BindPaths="$RUNNER_TEMP/fake-etc-nvme:/etc/nvme" \
            cat /etc/nvme/probe-marker

      - name: "CLEANUP"
        if: always()
        run: |
          sudo nvme disconnect-all || true
          sudo utils/nvmet/nvmet.py clean || true

      - name: "DMESG"
        if: always()
        run: sudo dmesg | tail -100

      - name: "SUMMARY"
        if: always()
        run: |
          {
            echo "## Coverage probe on $(uname -r)"
            echo
            echo "| check | outcome |"
            echo "|---|---|"
            echo "| modules (stock) | ${{ steps.modules.outcome }} |"
            echo "| modules (linux-modules-extra) | ${{ steps.modules_extra.outcome }} |"
            echo "| configfs | ${{ steps.configfs.outcome }} |"
            echo "| nvmet.py create | ${{ steps.nvmet.outcome }} |"
            echo "| nvme discover (loopback) | ${{ steps.discover.outcome }} |"
            echo "| nvme connect/disconnect | ${{ steps.connect.outcome }} |"
            echo "| avahi publish/browse/resolve | ${{ steps.avahi.outcome }} |"
            echo "| discover via mDNS address | ${{ steps.mdns_discover.outcome }} |"
            echo "| systemd-run BindPaths | ${{ steps.bindpaths.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
