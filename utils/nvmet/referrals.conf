# Config file format: Python, i.e. dict(), list(), int, str, etc...
# port ids (id) are integers 0...N
# namespaces are integers 0..N
# subsysnqn can be integers or strings
#
# Two Discovery Controllers that refer to each other. "nvme discover" on
# port 1 returns klingons plus a referral to port 2, and port 2 returns
# starfleet plus a referral back to port 1 - a deliberate cycle.
#
# Each port may list "referrals". The keys are those of a port:
#   trtype, adrfam, traddr, trsvcid  - required (only trtype for 'loop')
#   portid, treq                     - optional, reported as-is in the DLPE
#   name                             - optional configfs directory name
#                                      (default: the entry's index)
# The kernel always reports a referral under the well-known discovery NQN.
{
    'ports': [
        {
            'id': 1,
            'adrfam': 'ipv6',
            'traddr': '::',
            'trsvcid': 8009,
            'trtype': 'tcp',
            'referrals': [
                {
                    'adrfam': 'ipv4',
                    'traddr': '127.0.0.1',
                    'trsvcid': 4420,
                    'trtype': 'tcp',
                    'portid': 2,
                },
            ],
        },
        {
            'id': 2,
            'adrfam': 'ipv4',
            'traddr': '0.0.0.0',
            'trsvcid': 4420,
            'trtype': 'tcp',
            'referrals': [
                {
                    'adrfam': 'ipv6',
                    'traddr': '::1',
                    'trsvcid': 8009,
                    'trtype': 'tcp',
                    'portid': 1,
                },
            ],
        },
    ],

    'subsystems': [
        {
            'subsysnqn': 'nqn.1988-11.com.dell:klingons',
            'port': 1,
            'namespaces': [1, 2]
        },
        {
            'subsysnqn': 'nqn.1988-11.com.dell:starfleet',
            'port': 2,
            'namespaces': [1]
        },
    ]
}
