# Config file format: Python, i.e. dict(), list(), int, str, etc...
# port ids (id) are integers 0...N
# namespaces are integers 0..N
# subsysnqn can be integers or strings
# referrals: see referrals.conf for the keys
{
    'ports': [
        {
            'id': 1,
            # Listen on "::" rather than "0.0.0.0": nvmet accepts both IPv4
            # and IPv6 on the IPv6 wildcard, but only IPv4 on the IPv4 one.
            # The coverage run needs both, because it has a phase that sets
            # "ip-family=ipv6" and would otherwise have nothing to connect to.
            'adrfam': 'ipv6',
            'traddr': '::',
            'trsvcid': 8009,
            'trtype': 'tcp',
            'referrals': [
                {
                    'adrfam': 'ipv4',
                    'traddr': '127.0.0.1',
                    'trsvcid': 4420,
                    'trtype': 'tcp',
                    'portid': 2,
                },
            ],
        },
        {
            # A second Discovery Controller, known only through port 1's
            # referral. It refers back to port 1, so the two form a cycle.
            # IPv4 only on purpose: the "ip-family=ipv6" phase must drop
            # the referral to it.
            'id': 2,
            'adrfam': 'ipv4',
            'traddr': '0.0.0.0',
            'trsvcid': 4420,
            'trtype': 'tcp',
            'referrals': [
                {
                    'adrfam': 'ipv6',
                    'traddr': '::1',
                    'trsvcid': 8009,
                    'trtype': 'tcp',
                    'portid': 1,
                },
            ],
        },
    ],

    'subsystems': [
        {
            'subsysnqn': 'nqn.1988-11.com.dell:PowerSANxxx:01:20210225100113-454f73093ceb4847a7bdfc6e34ae8e28',
            'port': 1,
            'namespaces': [1]
        },
        {
            'subsysnqn': 'nqn.1988-11.com.dell:starfleet',
            'port': 1,
            'namespaces': [1, 2]
        },
        {
            'subsysnqn': 'nqn.1988-11.com.dell:klingons',
            'port': 1,
            'namespaces': [1, 2, 3]
        },
        {
            # Only reachable through the referral to port 2
            'subsysnqn': 'nqn.1988-11.com.dell:romulans',
            'port': 2,
            'namespaces': [1]
        },
    ]
}
