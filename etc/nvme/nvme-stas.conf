# ==============================================================================
# nvme-stas connectivity configuration - /etc/nvme/nvme-stas.conf
#
# Which NVMe-oF controllers nvme-stas should connect to, and with what
# parameters. Everything here is commented out except the Discovery Controller
# keep-alive, so out of the box nvme-stas configures no controllers - that is
# not an error, and mDNS-discovered controllers are unaffected.
#
# The format is libnvme's, so nvme-stas, the nvme-cli tools and nvme-discoverd
# all understand one format through one parser. nvme-stas reads its OWN file:
# /etc/nvme/nvme-fabrics.conf belongs to the nvme-cli tools and nvme-discoverd,
# and a host must be able to run nvme-stas and nvme-discoverd side by side,
# each connecting its own controllers.
#
# Drop-ins are read from /etc/nvme/nvme-stas.conf.d/*.conf, one host persona
# per file.
#
# Daemon behaviour - tracing, mDNS, zoning, exclusions - stays in
# /etc/nvme/stafd.conf and /etc/nvme/stacd.conf.
#
# See nvme-stas.conf(5).


# ==============================================================================
# Default connection parameters, by class of controller.
#
# There is deliberately no type-agnostic section: some parameters want a
# different default per class - most clearly the keep-alive timeout - so a
# value that applies to both is simply written in both sections.
#
# Every key is named the way the equivalent "nvme connect" option is named.
# An empty assignment ("key =") resets a parameter so that the kernel's own
# default applies.

# keep-alive-tmo is set here rather than left to the kernel, and is the one
# setting in this file that is not commented out. The kernel applies its 30
# second discovery default only when it recognises the well-known discovery
# NQN; a Discovery Controller with its own unique NQN gets the I/O default of
# 5 seconds instead. Setting it explicitly gives every Discovery Controller
# the same keep-alive, whichever NQN it uses.

[Discovery Controller Defaults]
keep-alive-tmo = 30
#ctrl-loss-tmo  = 600

#[I/O Controller Defaults]
#ctrl-loss-tmo  = 600
#nr-io-queues   = 4


# ==============================================================================
# The host identity these connections are made under.
#
# Omit the section, or omit a key, to use the system identity: hostnqn from
# /etc/nvme/hostnqn and hostid from /etc/nvme/hostid.
#
# A DIFFERENT identity is a different persona, and a persona belongs in its own
# drop-in file under /etc/nvme/nvme-stas.conf.d/. Give a persona both a hostnqn
# and a hostid: without an explicit hostid the kernel generates one that
# changes on every reboot, which breaks persistent reservations.

#[Host]
#hostnqn     = nqn.2014-08.org.nvmexpress:uuid:xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#hostid      = xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#hostsymname = my-host


# ==============================================================================
# Discovery Controllers - one section per controller, repeat as needed.
#
# stafd connects these and retrieves their Discovery Log Pages. Controllers
# found through mDNS need no section here.
#
# "nqn" is optional: omitted, it means the well-known discovery NQN
# (nqn.2014-08.org.nvmexpress.discovery).

#[Discovery Controller]
#controller = transport=tcp;traddr=192.168.1.10;trsvcid=8009

#[Discovery Controller]
#nqn        = nqn.2014-08.org.example:cdc.main
#controller = transport=tcp;traddr=192.168.1.11;trsvcid=8009


# ==============================================================================
# I/O subsystems - one section per subsystem, repeat as needed.
#
# stacd connects these. Subsystems learned from a Discovery Log Page need no
# section here.
#
# Each "controller =" line is one path to the subsystem; repeat the key for
# multipath. Per-section keys override the defaults above for that subsystem
# and all of its paths, and any "nvme connect" option may also appear on a
# "controller =" line to fine-tune a single path.

#[Subsystem]
#nqn        = nqn.2024-01.com.example:vol1
#controller = transport=tcp;traddr=192.168.1.20;trsvcid=4420

#[Subsystem]
#nqn           = nqn.2024-01.com.example:vol2
#ctrl-loss-tmo = 1800
#controller    = transport=tcp;traddr=192.168.1.21;trsvcid=4420;host-iface=eth0
#controller    = transport=tcp;traddr=192.168.1.22;trsvcid=4420;host-iface=eth1


# ==============================================================================
# Security parameters
#
# These are bound to the (host, subsystem) relationship rather than to a path,
# so they belong on [Host] or on an endpoint section - never on a
# "controller =" line.
#
#   kxchap-secret       the host's secret, authenticating it to the controller
#   kxchap-ctrl-secret  the controller's secret, for mutual authentication
#   tls                 enable TLS for the connection
#   tls-key             the PSK: a keyring key id, or NVMeTLSkey-1:01:...
#   tls-key-identity    the identity string bound to the PSK
#   keyring             the keyring the PSK is looked up in (default .nvme)
#   concat              derive the TLS PSK from KX-HMAC-CHAP authentication
#
# NOTE: kxchap secrets are always literal here - there is no keyring-reference
# form - so they sit in the clear in a file that is typically world-readable.

#[Subsystem]
#nqn           = nqn.2024-01.com.example:secure.vol1
#tls           = true
#tls-key       = NVMeTLSkey-1:01:...
#controller    = transport=tcp;traddr=192.168.1.30;trsvcid=4420
