# ==============================================================================
# STorage Appliance Finder Daemon (stafd) - configuration file
#
# In this file, options that are commented represent the default values used.
# Uncommented options override the default value.


[Global]
# tron:        Trace-ON. Enable additional debug info
#              Type:  boolean
#              Range: [false, true]
#tron=false

# ignore-iface: This option controls whether connections with Discovery
#               Controllers (DC) will be forced on a specific interface or
#               will rely on the routing tables to determine the interface.
#
#               See the man pages for details: man stafd.conf
#
#               Type:    boolean
#               Range:   [false, true]
#               Default: false
#ignore-iface=false

# ip-family: With this you can specify whether stafd will support IPv4, IPv6,
#            or both when connecting to Discovery Controllers (DC).
#
#            See the man pages for details: man stafd.conf
#
#            Type:    String
#            Range:   [ipv4, ipv6, ipv4+ipv6]
#            Default: ipv4+ipv6
#ip-family=ipv4+ipv6

# pleo: Port Local Entries Only. If enabled and supported, when connected to a
#       Direct Discovery Controller (DDC), stafd will ask the DDC to return
#       records for only NVM subsystem ports that are presented through the same
#       NVM subsystem port that received the Get Log Page command. When disabled
#       or not supported by the DDC, the DDC may return NVM subsystems that are
#       not even reachable by the host, including those using a transport
#       different from the transport used for the Get Log Page command (e.g. Get
#       Log Page using TCP and receiving FC subsystems). This configuration
#       parameter has no effect if the DDC does not support PLEO (see PLEOS).
#
#       Type:    String
#       Range:   [disabled, enabled]
#       Default: enabled
#pleo=enabled

# ==============================================================================
[Service Discovery]
# zeroconf: Control whether DNS-SD/mDNS automatic discovery is enabled. This is
#           used to enable or disable automatic discovery of Discovery
#           Controllers using DNS-SD/mDNS.
#
#           Type:    String
#           Range:   [disabled, enabled]
#           Default: enabled
#zeroconf=enabled

# ==============================================================================
[Discovery controller connection management]
# epcsd-poll-interval-minutes: How often to reconnect and re-check a Discovery
#                              Controller (DC) that does not support persistent
#                              discovery connections. Such a DC is disconnected
#                              between checks - there is nothing to hold open,
#                              and it cannot tell us its log pages changed - so
#                              polling is the only way to notice that they did.
#
#                              Whether a DC's connection is held open at all is
#                              not configured here: it is the "persistent" key
#                              of /etc/nvme/nvme-stas.conf, which takes "no",
#                              "auto" or "force" and can be set per DC. The
#                              default is "auto", meaning hold the connection
#                              open wherever the DC reports (through EPCSD)
#                              that it supports one. Note that this differs
#                              from a plain "nvme connect-all", which does not
#                              hold anything open unless asked to.
#                              Type:  unsigned integer
#                              Range: 1..N. 0 is not valid: this poll is the
#                                     only way a parked DC comes back.
#                              Default: 15
#epcsd-poll-interval-minutes=15

# dc-giveup-timeout: DCs that are discovered with mDNS service discovery
#                    which are later lost (i.e. no mDNS and TCP connection
#                    fails), will be purged from the configuration after this
#                    amount of time.
#                    Type:  Time span.
#                    Unit:  Takes a unit-less value in seconds, or a time span
#                           such as "3 days 5 hours". Note the unit is seconds,
#                           so "72" means 72 seconds, not 72 hours.
#                    Range: "infinity", 0, or a time span. "infinity" means
#                           never give up, 0 means give up immediately.
#                    Default: 72 hours (3 days)
#dc-giveup-timeout=72hours

# ==============================================================================
[Controllers]
# exclude: Excluded controllers. Using mDNS to automatically detect
#          and connect controllers, can result in unintentional connections
#          being made. This keyword allows configuring the controllers that
#          should not be connected to (whatever the reason may be).
#
#          DEPRECATED: use libnvme's host-wide exclusion list instead --
#          /etc/nvme/exclusions.conf and /etc/nvme/exclusions.conf.d/,
#          which are managed with "nvme exclusion". That list is honored by
#          every NVMe-oF tool on the host, not just stafd and stacd, and is
#          read live: an entry added there takes effect on the next
#          connection attempt, with no reload of stafd/stacd required.
#
#          "exclude=" still works and is honored in addition to libnvme's
#          list -- a controller is excluded if it matches either -- but it
#          will be removed in a future release.
#
#          Syntax:
#            exclude = transport=[trtype];traddr=[traddr];trsvcid=[trsvcid];host-iface=[iface];nqn=[nqn]
#
#          Every key is optional; host-traddr does not apply. Multiple
#          "exclude=" keywords may appear in the config file to define the
#          exclusion list.
#
#          Note 1: A minimal match approach is used to eliminate unwanted
#          controllers. That is, you do not need to specify all the
#          parameters to identify a controller. Just specifying the
#          host-iface, for example, can be used to exclude all controllers
#          on an interface.
#
#          Note 2: an exclusion takes precedence over the connectivity
#          configuration. A controller configured in
#          /etc/nvme/nvme-stas.conf can be eliminated by "exclude=".
#
#          Type:   String
#
#          Example:
#           exclude = transport=tcp;traddr=fe80::2c6e:dee7:857:26bb # Eliminate a specific address
#           exclude = host-iface=enp0s8                             # Eliminate everything on this interface
#exclude=
